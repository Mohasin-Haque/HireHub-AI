name: HireHub AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://demo-hirehub-ai.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "demo-anon-key-hirehub-ai-2026"
          NEXT_PUBLIC_APP_URL: "https://hirehub-ai.vercel.app"

  deploy-vercel:
    name: Deploy to Vercel
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
